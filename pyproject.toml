[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "campypump"
version = "0.5.1"
description = "Classify RE-cmeABC vs wildtype cmeABC efflux pump alleles in Campylobacter genomes"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["biopython>=1.80"]

[project.optional-dependencies]
excel = ["pandas", "openpyxl"]

[project.scripts]
campypump = "campypump.cli:main"

[tool.setuptools.package-data]
campypump = ["data/*.fasta", "data/species/*.fasta.gz"]
