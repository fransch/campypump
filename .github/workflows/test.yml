name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # the package claims >= 3.9; 0.1.18 shipped syntax that only 3.12 accepted,
        # so every supported version is tested on every push
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install BLAST+
        run: |
          sudo apt-get update
          sudo apt-get install -y ncbi-blast+
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install . pytest
      - name: Run tests
        run: pytest -q tests
      - name: Self-check on the bundled genomes
        run: bash verify_install.sh
