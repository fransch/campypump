# Draft bioconda recipe. Before submitting: push a tagged release (v0.5.1) to GitHub,
# fill in the URL and sha256 of the release tarball, then open a PR to bioconda-recipes.
{% set name = "campypump" %}
{% set version = "0.5.1" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/fransch/campypump/archive/refs/tags/v{{ version }}.tar.gz
  sha256: <SHA256_OF_TARBALL>

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv
  entry_points:
    - campypump = campypump.cli:main
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  host:
    - python >=3.10
    - pip
    - setuptools >=64
  run:
    - python >=3.10
    - biopython >=1.80
    - blast >=2.10
    - skani >=0.2

test:
  commands:
    - campypump --version
    - campypump run --help
    - skani -h

about:
  home: https://github.com/fransch/campypump
  license: MIT
  license_file: LICENSE
  summary: Classify RE-cmeABC vs wildtype cmeABC efflux pump alleles in Campylobacter genomes
